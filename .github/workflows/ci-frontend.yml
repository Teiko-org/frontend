name: CI Frontend

on:
  push:
    branches: [ main-teiko ]
  pull_request:
    branches: [ main-teiko ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carambolo-doces

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: carambolo-doces/package-lock.json

      - name: Install dependencies
        # Usamos npm install em vez de npm ci porque o package-lock.json é grande
        # e pode ficar levemente fora de sync após ajustes de deps opcionais (Rollup).
        # Em produção (Dockerfile) continuamos usando npm ci.
        run: npm install --include=dev --include=optional --no-audit --no-fund

      - name: Garantir binário nativo do Rollup para Linux (CI)
        # Instala apenas no ambiente do CI o pacote opcional usado pelo Rollup em Linux.
        # Não alteramos package.json; é só para evitar o erro "Cannot find module
        # @rollup/rollup-linux-x64-gnu" no runner do GitHub.
        run: npm install -D @rollup/rollup-linux-x64-gnu@4.40.0 --no-audit --no-fund || true

      # Ainda não temos suite de testes de frontend estável; por enquanto garantimos só o build.
      # - name: Run tests
      #   run: npm test -- --watch=false

      - name: Build
        run: npm run build

  build-and-push-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main-teiko'
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (para cache de dependências se quiser usar em builds locais)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Login to container registry
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            echo "Registro não configurado (REGISTRY_USERNAME/REGISTRY_PASSWORD). Pulando push de imagem."
            exit 0
          fi
          if [ -n "$REGISTRY_HOST" ]; then
            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USERNAME" --password-stdin
          else
            echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USERNAME" --password-stdin
          fi

      - name: Build and push frontend image
        working-directory: ./carambolo-doces
        env:
          FRONTEND_IMAGE: ${{ secrets.FRONTEND_IMAGE }}
        run: |
          IMAGE="${FRONTEND_IMAGE:-teiko/frontend:latest}"
          echo "Construindo imagem $IMAGE ..."
          docker build -f ../docker/Dockerfile -t "$IMAGE" ..
          if docker info >/dev/null 2>&1; then
            docker push "$IMAGE"
          fi


